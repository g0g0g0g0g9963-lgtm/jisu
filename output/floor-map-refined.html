<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<div id="bdo-plan-refined" class="viz-carousel viz-dotted-background" aria-label="기존 배치를 살린 배치도 시안" data-previous-label="이전 시안" data-next-label="다음 시안">
  <section data-variant="기존형 정돈" aria-label="기존형 정돈"><div class="plan-stage"><div class="plan-window" data-version="original" aria-label="기존형 정돈 디자인"></div></div></section>
  <section data-variant="장비 정보 분리" aria-label="장비 정보 분리" hidden><div class="plan-stage"><div class="plan-window plan-separated" data-version="separated" aria-label="장비 정보 분리 디자인"></div></div></section>
</div>
<style>
#bdo-plan-refined .plan-stage { min-height:636px; padding:24px 8px 8px; }
#bdo-plan-refined .plan-window {
 --plan-paper:light-dark(#ffffff,#1b2638); --plan-ink:light-dark(#1b2941,#eaf0fb);
 --plan-secondary:light-dark(#657489,#a7b6cd); --plan-border:light-dark(#dce3ed,#3d4c64);
 --plan-ground:light-dark(#f9fbfd,#121e30); --plan-mint:light-dark(#edf8f4,#193a35);
 --plan-mint-line:light-dark(#afd7c7,#397c68); --plan-green:light-dark(#0c8061,#85dfc1);
 --plan-blue:light-dark(#31547e,#abcfff); --plan-selection:light-dark(#f0f5fb,#243b59);
 --plan-check-ink:light-dark(#ffffff,#102440); --plan-shadow:light-dark(#253b5b0d,#00000025);
 --plan-selected-shadow:light-dark(#31547e14,#aacfff14); --plan-entry:light-dark(#df063d,#ff789b);
 --plan-radius:10px;
 width:100%; min-width:0; overflow:hidden; border:1px solid var(--plan-border); border-radius:20px;
 background:var(--plan-paper); color:var(--plan-ink); box-shadow:0 10px 36px var(--plan-shadow);
 font-family:'Noto Sans KR','Malgun Gothic',Arial,sans-serif; font-size:14px; line-height:1.5;
}
#bdo-plan-refined .plan-window * { box-sizing:border-box; font-family:inherit; }
#bdo-plan-refined .plan-window [hidden] { display:none!important; }
#bdo-plan-refined .plan-window button { font-family:inherit; }
#bdo-plan-refined .plan-header { min-height:78px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:12px 18px; gap:12px; border-bottom:1px solid var(--plan-border); }
#bdo-plan-refined .plan-header h3 { margin:0; color:var(--plan-ink); font-size:17px; font-weight:700; line-height:1.35; letter-spacing:-.5px; }
#bdo-plan-refined .plan-floor { padding:7px 24px; color:var(--plan-blue); background:var(--plan-selection); border:1px solid var(--plan-border); border-radius:100px; font-size:16px; font-weight:700; }
#bdo-plan-refined .plan-close { justify-self:end; width:44px; height:44px; display:grid; place-items:center; padding:0; background:var(--plan-paper); border:1px solid var(--plan-border); border-radius:50%; color:var(--plan-blue); }
#bdo-plan-refined .plan-close:hover { background:var(--plan-selection); }
#bdo-plan-refined .plan-close svg { width:20px; height:20px; }
#bdo-plan-refined .plan-content { padding:18px 16px 0; }
#bdo-plan-refined .plan-map {
 position:relative; height:406px; background:var(--plan-ground); border:1px solid var(--plan-border); border-radius:8px;
}
#bdo-plan-refined .plan-legend { position:absolute; top:18px; left:20px; right:20px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
#bdo-plan-refined .plan-location { display:flex; align-items:center; gap:7px; font-size:12px; color:var(--plan-secondary); }
#bdo-plan-refined .plan-location svg { width:14px; height:14px; }
#bdo-plan-refined .plan-legend-state { display:flex; gap:13px; color:var(--plan-secondary); font-size:11px; }
#bdo-plan-refined .plan-legend-state span { display:flex; align-items:center; gap:5px; }
#bdo-plan-refined .plan-legend-state i { display:block; width:7px; height:7px; border-radius:50%; background:var(--plan-green); }
#bdo-plan-refined .plan-legend-state b { display:block; width:9px; height:9px; border-radius:3px; border:1.5px solid var(--plan-blue); background:var(--plan-selection); }
#bdo-plan-refined .plan-room {
 position:absolute; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0;
 min-width:44px; min-height:44px; padding:16px 7px 12px; border:1px solid var(--plan-mint-line); border-radius:var(--plan-radius);
 background:var(--plan-mint); color:var(--plan-ink); text-align:center;
 box-shadow:0 5px 12px var(--plan-shadow); transition:background .12s,border-color .12s;
}
#bdo-plan-refined .plan-room[data-room="r3"] { left:9%; top:28%; width:18.5%; height:31%; }
#bdo-plan-refined .plan-room[data-room="r2"] { left:28.3%; top:28%; width:18.5%; height:31%; }
#bdo-plan-refined .plan-room[data-room="r1"] { left:47.6%; top:23%; width:20.8%; height:36%; }
#bdo-plan-refined .plan-room[data-room="large"] { left:9%; top:60.5%; width:37.8%; height:31%; }
#bdo-plan-refined .plan-room[data-room="w"] { left:80%; top:19%; width:18.5%; height:68%; }
#bdo-plan-refined .plan-room:hover { border-color:var(--plan-blue); }
#bdo-plan-refined .plan-room[aria-pressed="true"] { border:2px solid var(--plan-blue); background:var(--plan-selection); box-shadow:0 0 0 3px var(--plan-selected-shadow),0 5px 14px var(--plan-shadow); }
#bdo-plan-refined .plan-room-name { display:block; font-size:16px; font-weight:700; line-height:1.28; letter-spacing:-.5px; }
#bdo-plan-refined .plan-room-name .plan-name-prefix { display:block; font-size:13px; font-weight:600; letter-spacing:-.4px; margin-bottom:2px; }
#bdo-plan-refined .plan-room[data-room="large"] .plan-room-name,#bdo-plan-refined .plan-room[data-room="w"] .plan-room-name { font-size:17px; }
#bdo-plan-refined .plan-room-state { display:flex; align-items:center; justify-content:center; gap:5px; font-size:11px; color:var(--plan-green); font-weight:500; line-height:1.4; margin-top:9px; white-space:nowrap; }
#bdo-plan-refined .plan-room-state:before { content:""; display:block; width:5px; height:5px; background:currentColor; border-radius:50%; flex:none; }
#bdo-plan-refined .plan-room-capacity { margin-top:7px; color:var(--plan-secondary); font-size:11px; line-height:1.3; }
#bdo-plan-refined .plan-equipment { display:block; margin-top:6px; max-width:100%; color:var(--plan-secondary); font-size:11px; line-height:1.6; overflow-wrap:break-word; word-break:keep-all; }
#bdo-plan-refined .plan-check { position:absolute; top:8px; right:8px; width:19px; height:19px; display:none; align-items:center; justify-content:center; border-radius:50%; background:var(--plan-blue); color:var(--plan-check-ink); }
#bdo-plan-refined .plan-check svg { width:12px; height:12px; }
#bdo-plan-refined .plan-room[aria-pressed="true"] .plan-check { display:flex; }
#bdo-plan-refined .plan-entry { position:absolute; bottom:-1px; left:60%; transform:translateX(-50%); display:flex; align-items:center; gap:6px; padding:7px 12px 0; background:var(--plan-ground); color:var(--plan-entry); font-size:12px; font-weight:600; border-top:1px solid var(--plan-border); border-radius:8px 8px 0 0; }
#bdo-plan-refined .plan-entry svg { width:15px; height:15px; }
#bdo-plan-refined .plan-footer { min-height:48px; padding:13px 19px 15px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px 12px; color:var(--plan-secondary); font-size:11px; }
#bdo-plan-refined .plan-current { color:var(--plan-blue); font-size:12px; font-weight:500; }
#bdo-plan-refined .plan-current strong { font-weight:700; }
#bdo-plan-refined .plan-detail { display:none; }
#bdo-plan-refined .plan-separated .plan-map { height:356px; }
#bdo-plan-refined .plan-separated .plan-room { padding:12px 7px; }
#bdo-plan-refined .plan-separated .plan-equipment { display:none; }
#bdo-plan-refined .plan-separated .plan-detail { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px 14px; min-height:66px; margin-top:14px; padding:0 2px; }
#bdo-plan-refined .plan-detail-name { display:flex; align-items:center; gap:8px; color:var(--plan-ink); font-size:15px; font-weight:700; }
#bdo-plan-refined .plan-detail-name small { color:var(--plan-secondary); font-size:11px; font-weight:400; }
#bdo-plan-refined .plan-detail-equipment { display:flex; align-items:center; gap:7px; color:var(--plan-secondary); font-size:12px; }
#bdo-plan-refined .plan-detail-equipment svg { width:15px; height:15px; color:var(--plan-blue); }
#bdo-plan-refined .plan-separated .plan-current { display:none; }
#bdo-plan-refined .plan-separated .plan-footer { justify-content:flex-end; padding-top:4px; min-height:28px; }
#bdo-plan-refined .plan-reopen { min-height:530px; display:grid; place-items:center; }
#bdo-plan-refined .plan-reopen button { min-height:44px; padding:10px 16px; background:var(--plan-paper); border:1px solid var(--plan-border); border-radius:9px; color:var(--plan-blue); font-size:14px; }
@media(max-width:560px) {
 #bdo-plan-refined .plan-stage { min-height:652px; padding:24px 3px 8px; }
 #bdo-plan-refined .plan-header { padding:12px; gap:7px; }
 #bdo-plan-refined .plan-header h3 { font-size:15px; }
 #bdo-plan-refined .plan-floor { padding:6px 13px; font-size:14px; }
 #bdo-plan-refined .plan-content { padding:12px 9px 0; }
 #bdo-plan-refined .plan-map,#bdo-plan-refined .plan-separated .plan-map { height:392px; }
 #bdo-plan-refined .plan-legend { left:10px; right:10px; top:14px; flex-wrap:wrap; }
 #bdo-plan-refined .plan-location { font-size:11px; }
 #bdo-plan-refined .plan-legend-state { gap:8px; }
 #bdo-plan-refined .plan-room { padding:18px 3px 10px; }
 #bdo-plan-refined .plan-room[data-room="r3"] { left:3%; width:19.5%; }
 #bdo-plan-refined .plan-room[data-room="r2"] { left:23.8%; width:19.5%; }
 #bdo-plan-refined .plan-room[data-room="r1"] { left:44.6%; width:21%; }
 #bdo-plan-refined .plan-room[data-room="large"] { left:3%; width:40.3%; }
 #bdo-plan-refined .plan-room[data-room="w"] { left:77%; width:21%; }
 #bdo-plan-refined .plan-room-name { font-size:13px; letter-spacing:-.4px; }
 #bdo-plan-refined .plan-room-name .plan-name-prefix,#bdo-plan-refined .plan-equipment { display:none; }
 #bdo-plan-refined .plan-room[data-room="large"] .plan-room-name,#bdo-plan-refined .plan-room[data-room="w"] .plan-room-name { font-size:14px; }
 #bdo-plan-refined .plan-room-state { font-size:11px; gap:3px; margin-top:8px; white-space:normal; }
 #bdo-plan-refined .plan-room-state .plan-now { display:none; }
 #bdo-plan-refined .plan-room-capacity .plan-max { display:none; }
 #bdo-plan-refined .plan-check { width:14px; height:14px; right:4px; top:4px; }
 #bdo-plan-refined .plan-check svg { width:10px; height:10px; }
 #bdo-plan-refined .plan-entry { left:60%; font-size:11px; padding-left:6px; padding-right:6px; }
 #bdo-plan-refined .plan-footer { padding:10px 12px 13px; }
 #bdo-plan-refined .plan-current { display:none; }
 #bdo-plan-refined .plan-detail,#bdo-plan-refined .plan-separated .plan-detail { display:flex; flex-wrap:wrap; gap:4px 10px; padding:12px 3px 2px; margin:0; min-height:64px; }
 #bdo-plan-refined .plan-detail-name { font-size:14px; }
 #bdo-plan-refined .plan-detail-equipment { font-size:11px; }
}
@media(prefers-reduced-motion:reduce) { #bdo-plan-refined .plan-room { transition:none; } }
</style>
<script>
(() => {
 const root=document.getElementById('bdo-plan-refined');
 const rooms=[
  {id:'r3',name:'Conference Room 3',short:'Room 3',capacity:4,equipment:''},
  {id:'r2',name:'Conference Room 2',short:'Room 2',capacity:4,equipment:''},
  {id:'r1',name:'Conference Room 1',short:'Room 1',capacity:6,equipment:'모니터 · 화이트보드'},
  {id:'large',name:'대회의실',short:'대회의실',capacity:16,equipment:'글라스보드 · 대형 모니터'},
  {id:'w',name:'W Room',short:'W Room',capacity:16,equipment:'글라스보드 · 대형 모니터'}
 ];
 const selected={original:'large',separated:'large'};
 function restore(saved) { const data=saved?.privateContent?.selected; if(data) for(const key of Object.keys(selected)) if(rooms.some(r=>r.id===data[key])) selected[key]=data[key]; }
 restore(window.openai?.widgetState);
 function roomHTML(room) {
  return `<button type="button" class="plan-room cursor-interaction" data-room="${room.id}" aria-label="${room.name}, 최대 ${room.capacity}명, 사용 가능 예시" aria-pressed="false"><span class="plan-check"><i data-lucide="check" aria-hidden="true"></i></span><span class="plan-room-name">${room.id.startsWith('r')?'<span class="plan-name-prefix">Conference</span>':''}${room.short}</span><span class="plan-room-state"><span><span class="plan-now">지금 </span>사용 가능</span></span><span class="plan-room-capacity"><span class="plan-max">최대 </span>${room.capacity}명</span>${room.equipment?`<span class="plan-equipment">${room.equipment}</span>`:''}</button>`;
 }
 function render(product) {
  const room=rooms.find(r=>r.id===selected[product.dataset.version]);
  product.querySelectorAll('[data-room]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.room===room.id)));
  product.querySelector('[data-current-name]').textContent=room.name;
  product.querySelector('[data-detail-name]').textContent=room.name;
  product.querySelector('[data-detail-capacity]').textContent=`최대 ${room.capacity}명`;
  product.querySelector('[data-detail-equipment]').textContent=room.equipment || '장비 정보 없음';
 }
 for(const product of root.querySelectorAll('.plan-window')) {
  product.innerHTML=`<div class="plan-dialog"><header class="plan-header"><h3>회의실 배치도</h3><span class="plan-floor">12층</span><button type="button" class="plan-close cursor-interaction" aria-label="시안 닫기"><i data-lucide="x" aria-hidden="true"></i></button></header><div class="plan-content"><div class="plan-map" role="group" aria-label="12층 위치 관계 시안: 왼쪽 위부터 Room 3, Room 2, Room 1, 아래 대회의실, 오른쪽 W Room, 아래 출입구"><div class="plan-legend"><span class="plan-location"><i data-lucide="map-pin" aria-hidden="true"></i>서울 오피스</span><span class="plan-legend-state"><span><i aria-hidden="true"></i>사용 가능</span><span><b aria-hidden="true"></b>선택</span></span></div>${rooms.map(roomHTML).join('')}<span class="plan-entry"><i data-lucide="log-in" aria-hidden="true"></i>출입구</span></div><div class="plan-detail" aria-live="polite"><div class="plan-detail-name"><span data-detail-name></span><small data-detail-capacity></small></div><span class="plan-detail-equipment"><i data-lucide="monitor" aria-hidden="true"></i><span data-detail-equipment></span></span></div></div><footer class="plan-footer"><span class="plan-current" aria-live="polite">선택한 회의실 <strong data-current-name></strong></span><span>위치·크기는 개략 표시 · 상태는 시안용 예시</span></footer></div><div class="plan-reopen" hidden><button type="button" class="cursor-interaction">배치도 다시 보기</button></div>`;
  product.querySelectorAll('[data-room]').forEach(button=>button.addEventListener('click',()=>{
   selected[product.dataset.version]=button.dataset.room;render(product);
   window.openai?.setWidgetState?.({modelContent:{design:product.getAttribute('aria-label'),room:rooms.find(r=>r.id===button.dataset.room).name},privateContent:{selected:{...selected}}})?.catch(()=>{});
  }));
  const content=product.querySelector('.plan-dialog'), reopen=product.querySelector('.plan-reopen'), close=product.querySelector('.plan-close');
  close.addEventListener('click',()=>{content.hidden=true;reopen.hidden=false;reopen.querySelector('button').focus();});
  reopen.querySelector('button').addEventListener('click',()=>{content.hidden=false;reopen.hidden=true;close.focus();});
  render(product);
  if(globalThis.Tweak) { const settings={rounding:10}; const tweak=new Tweak({container:product,onChange:()=>product.style.setProperty('--plan-radius',settings.rounding+'px')});tweak.addSlider(settings,'rounding',{label:'회의실 모서리',min:4,max:16,step:2,unit:'px'}); }
 }
 window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);root.querySelectorAll('.plan-window').forEach(render);}});
 if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
})();
</script>
